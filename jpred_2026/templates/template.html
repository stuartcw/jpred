<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPred {{year}}</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="content">
    <h1><a href="/">JPred {{year}}</a></h1>
    <a href="users.html">Leaderboard</a>
    {% for column, results in data.items() %}
    <h2>Predictions for {{ column }}</h2>
    <div class="table-wrap">
    <table>
        <thead>
        <tr>
            <th>Team</th>
            <th># of Predictions</th>
        </tr>
        </thead>
        <tbody>
        {% for value, count in results %}
        <tr>
            <td data-label="Team"><a href="teams.html#{{ value | team_id }}">{{ value }}</a></td>
            <td data-label="Predictions">{{ count }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
    </div>
    {% endfor %}
    </div>
</body>
</html>
